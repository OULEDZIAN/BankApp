name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/swiftlint
          key: homebrew-swiftlint-${{ runner.os }}-${{ hashFiles('.swiftlint.yml') }}
          restore-keys: |
            homebrew-swiftlint-${{ runner.os }}-

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: make lint

  test:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app

      - name: Cache iOS Platform
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/CoreSimulator/Profiles/Runtimes
            /Library/Developer/CoreSimulator/Profiles/Runtimes
          key: ios-platform-26-${{ runner.os }}
          restore-keys: |
            ios-platform-26-

      - name: Download iOS 26 platform
        run: xcodebuild -downloadPlatform iOS
        timeout-minutes: 30

      - name: Run Tests
        run: make test

      - name: Extract Coverage
        run: |
          PCT=$(xcrun xccov view --report --json coverage.xcresult | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(f'{d[\"lineCoverage\"]*100:.1f}')" 2>/dev/null || echo "N/A")
          echo "COVERAGE_PCT=$PCT" >> $GITHUB_ENV
          echo "Coverage: $PCT%"

      - name: Coverage
        continue-on-error: true
        run: make coverage

      - name: Post Coverage Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const coverage = process.env.COVERAGE_PCT || 'N/A';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📊 Code Coverage\n\n**Global coverage: ${coverage}%**\n\nMinimum required: 70%`
            })

      - name: Job Summary
        if: always()
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Coverage: ${COVERAGE_PCT:-N/A}%" >> $GITHUB_STEP_SUMMARY

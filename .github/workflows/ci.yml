name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Coverage
        run: make coverage

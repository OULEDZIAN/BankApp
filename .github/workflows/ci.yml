name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app

      - name: Download iOS 26 platform
        run: xcodebuild -downloadPlatform iOS
        timeout-minutes: 30

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: make lint

      - name: Run Tests
        run: make test

      - name: Coverage
        run: make coverage
